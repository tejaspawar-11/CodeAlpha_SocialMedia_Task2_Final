<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | SocialConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .container {
            max-width: 600px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        textarea,
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>✏️ Edit Profile</h1>

        <form method="POST">
            {% csrf_token %}

            <label>Bio</label>

            <textarea
                name="bio"
                placeholder="Tell something about yourself..."
            >{{ user_profile.bio }}</textarea>


            <label>Profile Image URL</label>

            <input
                type="url"
                name="profile_image"
                value="{{ user_profile.profile_image }}"
                placeholder="https://example.com/profile.jpg"
            >


            <button type="submit">
                Save Changes
            </button>

        </form>

        <a
            href="{% url 'profile' user.username %}"
            class="back"
        >
            ← Back to Profile
        </a>

    </div>

</div>

</body>
</html>
